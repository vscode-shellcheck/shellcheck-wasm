name: Bump ShellCheck

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare with the latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/koalaman/shellcheck/releases/latest --jq .tag_name)"
          current="$(cat buildtools/wasm/version.txt)"
          echo "upstream: $latest, pinned: $current"
          if ! [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected upstream tag: $latest"
            exit 1
          fi
          if [ "$latest" = "$current" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "tag=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pins
        if: steps.upstream.outputs.bump == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          curl -fL --retry 5 -o "$RUNNER_TEMP/src.tar.gz" \
            "https://github.com/koalaman/shellcheck/archive/refs/tags/${TAG}.tar.gz"
          sha256sum "$RUNNER_TEMP/src.tar.gz" | cut -d' ' -f1 > buildtools/wasm/shellcheck-src.sha256
          printf '%s\n' "$TAG" > buildtools/wasm/version.txt
          git diff --stat

      - uses: peter-evans/create-pull-request@v7
        if: steps.upstream.outputs.bump == 'true'
        with:
          # PRs opened with github.token do not trigger CI; set BUMP_PR_TOKEN (a PAT or
          # GitHub App token) to get the build/test run on the bump PR.
          token: ${{ secrets.BUMP_PR_TOKEN || github.token }}
          branch: bump/shellcheck-${{ steps.upstream.outputs.tag }}
          delete-branch: true
          commit-message: "chore(wasm): bump ShellCheck to ${{ steps.upstream.outputs.tag }}"
          title: "chore(wasm): bump ShellCheck to ${{ steps.upstream.outputs.tag }}"
          body: |
            Updates the pinned ShellCheck release to [${{ steps.upstream.outputs.tag }}](https://github.com/koalaman/shellcheck/releases/tag/${{ steps.upstream.outputs.tag }}).

            `buildtools/wasm/shellcheck-src.sha256` was recomputed from the upstream source tarball.
          labels: dependencies
