name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Read pins
        id: pins
        run: |
          {
            echo "shellcheck_version=$(cat buildtools/wasm/version.txt)"
            echo "shellcheck_src_sha256=$(cat buildtools/wasm/shellcheck-src.sha256)"
            echo "ghc_wasm_meta_commit=$(cat buildtools/wasm/ghc-wasm-meta.txt)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: buildtools/wasm
          file: buildtools/wasm/Dockerfile
          target: artifact
          outputs: type=local,dest=dist
          # buildx would otherwise drop a SLSA provenance.json into dist/, which ships in the npm package
          provenance: false
          build-args: |
            SHELLCHECK_VERSION=${{ steps.pins.outputs.shellcheck_version }}
            SHELLCHECK_SRC_SHA256=${{ steps.pins.outputs.shellcheck_src_sha256 }}
            GHC_WASM_META_COMMIT=${{ steps.pins.outputs.ghc_wasm_meta_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: cat dist/build-info.json

      - uses: actions/upload-artifact@v4
        with:
          name: shellcheck-wasm
          path: dist/
          if-no-files-found: error

  test:
    needs: build-wasm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: shellcheck-wasm
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: bash scripts/fetch-native-shellcheck.sh
      - run: npm run build
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm test

      - name: Check the packed tarball contains the artifact
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const [pkg] = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const paths = pkg.files.map((f) => f.path);
            if (!paths.includes("dist/shellcheck.wasm")) {
              console.error("dist/shellcheck.wasm is not in the tarball:", paths);
              process.exit(1);
            }
          ' "$RUNNER_TEMP/pack.json"
