name: Release

on:
  push:
    branches: [main, next]

permissions:
  contents: read

# Queue rather than cancel: a cancelled run could stop between the npm publish and the tag push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads every tag and its git notes to find the last release per channel.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: shellcheck-wasm
          path: dist

      # No registry-url: setup-node would write an .npmrc expecting NODE_AUTH_TOKEN, and
      # @semantic-release/npm has to fall through to Trusted Publishing (OIDC) instead.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # main publishes to the `latest` dist-tag; next publishes x.y.z-next.n to `next` and marks
      # its GitHub Release as a prerelease. npm-side Trusted Publisher: package
      # @vscode-shellcheck/shellcheck-wasm, repo vscode-shellcheck/shellcheck-wasm, workflow
      # release.yml.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
